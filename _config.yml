# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.


title:  Jérémie Mabiala
lang: en
firstName: Jérémie
lastName: Mabiala
email: 
  - jnlandu00@gmail.com

profile_alt: Jérémie Mabiala
profile_image: /assets/profiles/img-hero.jpeg


# Location & Institution
location:
  name: AUBAINE
  city: Dakar, Senegal
  plus_code: PG2J+X2M
  icon: fa-solid fa-location-dot

# Navigation
header_pages:
  - index.md
  - about.md
  - news.md

# Site Description
description: >- 
      Jeremie Mabiala

# Site Configuration
baseurl: "" 
url: "https://jnlandu.github.io"

# Build settings
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-toc
  - jekyll-redirect-from

# Kramdown — protect math expressions from Markdown emphasis/escaping
kramdown:
  math_engine: mathjax
  math_engine_opts: {}

# Permalink settings
permalink: /posts/:title

github_repo: https://github.com/jnlandu/jnlandu.github.io/

# Pagination settings
pagination:
  enabled: true
  per_page: 5  # Number of posts per page
  permalink: "/page:num/"  # Optional: Customize the pagination URL

sitemap:
  exclude:
    - /404.html

# Social Media & SEO
social:
  name: Jeremie Nlandu Mabiala
  links:
    - https://twitter.com/ValentinMabiala
    - https://www.linkedin.com/in/jeremie-nlandu-mabiala-aa3a1b1b
    - https://github.com/jnlandu
    - mailto:jnlandu00@gmail.com

# jekyll-seo-tag extras
logo: /profile.png
favicon: /profile3.png
twitter:
  username: ValentinMabiala
  card: summary_large_image
facebook:
  publisher: https://www.facebook.com/ # optional
author:
  name: Jeremie Nlandu Mabiala
  avatar: /profile.png
  url: https://jnlandu.github.io

defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /profile3.png
      author: "Jeremie Nlandu Mabiala"
      sitemap: true
  - scope:
      path: ""
      type: tutorials
    values:
      image: /profile3.png
      author: "Jeremie Nlandu Mabiala"
      sitemap: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project-detail
      image: /profile3.png
      author: "Jeremie Nlandu Mabiala"
      sitemap: true
  - scope:
      path: ""
      type: news
    values:
      layout: news_item
      image: /profile3.png
      author: "Jeremie Nlandu Mabiala"
      sitemap: true

# Analytics & Verification
google_analytics: G-ZQTH7FZ9T4
google_site_verification: u4WXQl0Eu66rsQo2kRdCNx

# Professional Details
profession:
  current_role: AI Master's Student
  institution: AIMS Senegal
  program: African Master in Machine Intelligence (AMMI)
  research_interests:
    - Artificial Intelligence
    - Machine Learning
    - Deep Learning
    - Mathematical Modeling
    - Computer Vision
    - Natural Language Processing
    - Optimization
    - Statistical Learning

# AI Engineer Specializations
specializations:
  - name: Machine Learning
    level: advanced
    tools: [Python, PyTorch, TensorFlow, Scikit-learn]
  - name: Computer Vision
    level: intermediate
    tools: [OpenCV, PIL, Matplotlib]
  - name: Natural Language Processing
    level: intermediate
    tools: [NLTK, spaCy, Transformers]
  - name: Mathematical Modeling
    level: advanced
    tools: [NumPy, SciPy, R]

#  Updated theme schemas:
sass:
  sass_dir: _sass
  style: expanded
  # sourcemap: always
  # quiet_deps: false
  # verbose: false

collections:
  events:
    output: true
    permalink: /events/:title/
  tutorials:
    output: true
    permalink: /tutorials/:title/
  projects:
    output: true
    permalink: /projects/:title/
